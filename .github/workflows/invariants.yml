name: Appointment invariants

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appointment
          POSTGRES_PASSWORD: appointment
          POSTGRES_DB: appointment_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U appointment -d appointment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APPOINTMENT_ENV: test
      APPOINTMENT_DATABASE_URL: postgresql+asyncpg://appointment:appointment@127.0.0.1:5433/appointment_test
      APPOINTMENT_MODEL_BACKEND: stub
      APPOINTMENT_AGENT_RUNTIME: deterministic
      APPOINTMENT_NOTIFICATION_PROVIDER: sandbox
      APPOINTMENT_ALLOW_TEMP_IDENTITY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install vendor/agentscope-2.0.8-py3-none-any.whl
      - name: Run isolated regression suite
        run: python -B -m pytest -q -p no:cacheprovider --tb=short
