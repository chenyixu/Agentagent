name: Synthetic Agent evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_real_api:
        description: "Send synthetic scenarios to DeepSeek and consume API quota"
        required: true
        type: boolean
        default: false

concurrency:
  group: synthetic-agent-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ inputs.confirm_real_api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appointment
          POSTGRES_PASSWORD: appointment
          POSTGRES_DB: appointment_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U appointment -d appointment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APPOINTMENT_ENV: test
      APPOINTMENT_DATABASE_URL: postgresql+asyncpg://appointment:appointment@127.0.0.1:5433/appointment_test
      APPOINTMENT_MODEL_BACKEND: deepseek
      APPOINTMENT_MODEL_NAME: deepseek-flash
      APPOINTMENT_AGENT_RUNTIME: agentscope
      APPOINTMENT_AGENT_PROMPT_VERSION: reception-v3
      APPOINTMENT_NOTIFICATION_PROVIDER: sandbox
      APPOINTMENT_ALLOW_TEMP_IDENTITY: 'true'
      APPOINTMENT_EVAL_MODEL: deepseek-flash
      APPOINTMENT_EVAL_PROMPT_VERSION: reception-v3
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify DeepSeek secret is configured
        id: verify_secret
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Repository Actions secret DEEPSEEK_API_KEY is required."
            exit 1
          fi
      - name: Install dependencies
        id: install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'vendor/agentscope-2.0.8-py3-none-any.whl[service]'
      - name: Run scored first-turn Agent scenarios
        id: first_turn
        run: python -B evals/run_synthetic_business_agent_eval.py --scored-only --fail-on-nonpass
      - name: Run transactional Agent scenarios
        if: ${{ always() && steps.verify_secret.outcome == 'success' && steps.install.outcome == 'success' }}
        run: python -B evals/run_synthetic_business_transaction_agent_eval.py --fail-on-nonpass
      - name: Upload synthetic evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-agent-evaluation-${{ github.run_id }}
          path: |
            evals/reports/synthetic_business_agent_*.jsonl
            evals/reports/synthetic_business_agent_*_summary_*.json
            evals/reports/synthetic_business_transaction_agent_*.jsonl
            evals/reports/synthetic_business_transaction_agent_*_summary.json
          if-no-files-found: warn
          retention-days: 14
